# Yogatik Terminal Configuration
# This file is automatically generated on first run.
# Edit with care - invalid TOML will fall back to defaults.

[core]
default_profile = "default"
confirm_close = true
confirm_multiple_tabs = true
startup_mode = "restore"
check_updates = true

[core.rendering]
renderer = "webgl"
gpu_acceleration = true
vsync = true
max_fps = 60

[core.performance]
scrollback_lines = 10000
alt_scrollback_lines = 1000
repaint_throttle_ms = 0
dirty_row_threshold = 10

[profiles.default]
name = "Default"
shell = "auto"
cwd = "home"
cols = 120
rows = 32
scrollback_lines = 10000

[profiles.default.font]
family = "JetBrains Mono"
size = 13
line_height = 1.4
letter_spacing = 0
ligatures = true
fallback = ["Noto Color Emoji", "Symbols Nerd Font Mono"]

[profiles.default.theme]
background = "#1e1e2e"
foreground = "#cdd6f4"
cursor = "#f5e0dc"
cursor_accent = "#1e1e2e"
selection = "#45475a"
ansi = { black = "#1e1e2e", red = "#f38ba8", green = "#a6e3a1", yellow = "#f9e2af", blue = "#89b4fa", magenta = "#f5c2e7", cyan = "#94e2d5", white = "#bac2de" }
ansi_bright = { black = "#6c7086", red = "#f38ba8", green = "#a6e3a1", yellow = "#f9e2af", blue = "#89b4fa", magenta = "#f5c2e7", cyan = "#94e2d5", white = "#a6adc8" }

[profiles.default.bell]
enabled = true
sound = "system"
visual = true
flash_duration = 100

[profiles.default.cursor]
style = "block"
blink = true
blink_rate = 530

[profiles.default.mouse]
enabled = true
protocol = "sgr"
hide_when_typing = true

[keybindings]
"Ctrl+Shift+T" = "newTab"
"Ctrl+Shift+W" = "closeTab"
"Ctrl+Tab" = "nextTab"
"Ctrl+Shift+Tab" = "prevTab"
"Ctrl+Shift+D" = "splitHorizontal"
"Ctrl+Shift+E" = "splitVertical"
"Alt+Right" = "focusPaneRight"
"Alt+Left" = "focusPaneLeft"
"Alt+Up" = "focusPaneUp"
"Alt+Down" = "focusPaneDown"
"Ctrl+Shift+C" = "copy"
"Ctrl+Shift+V" = "paste"
"Ctrl+Shift+F" = "find"
"Ctrl+Plus" = "increaseFontSize"
"Ctrl+Minus" = "decreaseFontSize"
"Ctrl+0" = "resetFontSize"

[shell_integration]
enabled = true
auto_inject = true
osc7 = true
osc133 = true
bracket_paste = true

[security]
pty_sandbox = true
osc52_write_requires_gesture = true
deny_file_uris = true
denied_sequences = [
  "\x1b[?3h", "\x1b[?5h", "\x1b[?6h", "\x1b[?7h",
  "\x1b[?25h", "\x1b[?47h", "\x1b[?1049h",
  "\x1b]20;", "\x1b]50;", "\x1b]51;", "\x1b]52;c;",
  "\x1b]777;", "\x1b]21;", "\x1b]22;",
]

[advanced]
experimental_kitty_graphics = false
experimental_sixel = false
log_pty_traffic = false
audit_log = false