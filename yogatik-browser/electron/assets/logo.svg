<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="yogatik-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a18" />
      <stop offset="50%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>
    <linearGradient id="needle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffe6cc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring with Yogatik Orange Gradient -->
  <circle cx="64" cy="52" r="38" fill="none" stroke="url(#yogatik-grad)" stroke-width="7" stroke-linecap="round" />

  <!-- Inner Dynamic Navigation Compass Needle -->
  <polygon points="64,28 76,58 64,52" fill="url(#needle-grad)" filter="url(#glow)" />
  <polygon points="64,28 52,58 64,52" fill="#ffb066" />
  <polygon points="64,76 76,58 64,52" fill="#ff6600" opacity="0.8" />
  <polygon points="64,76 52,58 64,52" fill="#e64a00" opacity="0.9" />
  <circle cx="64" cy="52" r="3.5" fill="#ffffff" />

  <!-- Floating Hover Lines (Distinctive Yogatik Signature) -->
  <line x1="38" y1="102" x2="90" y2="102" stroke="url(#yogatik-grad)" stroke-width="6" stroke-linecap="round" />
  <line x1="48" y1="114" x2="80" y2="114" stroke="url(#yogatik-grad)" stroke-width="5" stroke-linecap="round" opacity="0.75" />
</svg>
