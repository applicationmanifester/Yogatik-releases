<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Yogatik Browser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 420px;
      height: 320px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: radial-gradient(120% 120% at 50% 20%, #151b26 0%, #0a0e14 85%);
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 122, 24, 0.25);
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(255, 122, 24, 0.15);
      user-select: none;
      position: relative;
    }
    .ambient-glow {
      position: absolute;
      top: -30px;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(255, 122, 24, 0.22) 0%, rgba(255, 122, 24, 0) 70%);
      filter: blur(20px);
      pointer-events: none;
      animation: pulse 2.4s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.15); opacity: 1; }
    }
    .logo-container {
      position: relative;
      margin-bottom: 16px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .logo-container img {
      width: 76px;
      height: 76px;
      filter: drop-shadow(0 10px 24px rgba(255, 122, 24, 0.35));
    }
    .brand-name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 0%, #ffbb77 60%, #ff7a18 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .tagline {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 500;
      letter-spacing: 0.3px;
      margin-bottom: 24px;
    }
    .loader-bar {
      width: 180px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }
    .loader-progress {
      position: absolute;
      top: 0;
      left: -40%;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, transparent, #ff7a18, #ffb066, transparent);
      border-radius: 99px;
      animation: loading 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes loading {
      0% { left: -40%; }
      100% { left: 100%; }
    }
    .version {
      position: absolute;
      bottom: 14px;
      font-size: 10px;
      color: #475569;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>
  <div class="logo-container">
    <img src="logo.svg" alt="Yogatik Logo" />
  </div>
  <h1 class="brand-name">Yogatik Browser</h1>
  <p class="tagline">Browse Smarter · Stay Private</p>
  <div class="loader-bar">
    <div class="loader-progress"></div>
  </div>
  <span class="version">v1.0 Standalone</span>
</body>
</html>
