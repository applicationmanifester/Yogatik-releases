name: Build Windows desktop app

# MANUAL ONLY. This is the legacy Tauri shell; electron-release.yml is the one
# that feeds /platforms. It used to fire on 'v*' too, so a single tag ran both
# workflows and this one published a SECOND release — to the private source
# repo, whose assets no anonymous visitor can download. Electron is the shipping
# path; run this by hand if you specifically want a Tauri build.
on:
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release and upload the .exe

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build app and publish installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'desktop-latest' }}
          # Inner quotes MUST be doubled: a single-quoted YAML scalar ends at the
          # first lone ', so the un-escaped form was a workflow-wide parse error.
          releaseName: 'Yogatik Desktop ${{ github.ref_type == ''tag'' && github.ref_name || ''(latest)'' }}'
          releaseBody: 'Windows installer (.exe / .msi). Download the .exe under Assets below.'
          releaseDraft: false
          prerelease: false
