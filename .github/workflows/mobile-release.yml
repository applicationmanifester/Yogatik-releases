name: Mobile Release (Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v12.3.0)'
        required: false

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Build Vite web app
        working-directory: frontend
        env:
          NODE_ENV: production
        run: npm run build

      - name: Sync Capacitor to Android
        working-directory: frontend
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ]; then VERSION="dev"; fi
          mv frontend/android/app/build/outputs/apk/debug/app-debug.apk \
             Yogatik-${VERSION}-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yogatik-Android-APK
          path: Yogatik-*-android.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Yogatik-*-android.apk
          generate_release_notes: false
          body: |
            ## Yogatik ${{ github.ref_name }} - Android
            
            ### Installation
            1. Download the APK file below
            2. On your Android phone, enable Settings -> Install unknown apps
            3. Open the APK and tap Install
            
            Minimum requirement: Android 7.0+ (API 24)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
