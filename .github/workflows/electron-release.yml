name: Build web app and desktop apps (Windows, macOS, Linux)

# Manual run (Actions tab -> Run workflow) or on a version tag like v3.9.0.
#
# WHY A MATRIX: macOS installers cannot be cross-compiled — electron-builder
# needs a real macOS runner to produce a .dmg, and AppImage/deb want Linux
# tooling. Each OS therefore builds on its own runner and every artefact is
# uploaded to ONE GitHub Release, which is what /platforms links to.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish into, e.g. v3.9.1. Leave blank for desktop-latest.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failing must not discard the other two.
      fail-fast: false
      # All three jobs publish into ONE release. Run them one at a time so the
      # first creates it and the rest update it; in parallel they can each reach
      # the create step before any has finished, which races (duplicate release
      # or a 422). Releases are rare — serial wall-clock is the cheap trade.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            name: Windows
            build: npm run electron:build
          - os: macos-latest
            name: macOS
            build: npm run electron:build:mac
          - os: ubuntu-latest
            name: Linux
            build: npm run electron:build:linux

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    env:
      # Publishing to the public mirror needs a PAT; GITHUB_TOKEN cannot write
      # to another repository. Absent = build and upload artefacts, skip publish.
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # A dispatch builds the BRANCH, not the tag, so publishing it into a
      # release named for a different version silently ships mismatched
      # latest*.yml — the updater then reads the old version back and never
      # offers the upgrade. Fail loudly instead of producing that quietly.
      - name: Refuse to publish a build whose version does not match the tag
        if: github.ref_type != 'tag' && inputs.tag != ''
        shell: bash
        run: |
          pkg=$(node -p "require('./frontend/package.json').version")
          want="${{ inputs.tag }}"
          want="${want#v}"
          if [ "$pkg" != "$want" ]; then
            echo "::error::Refusing to publish into ${{ inputs.tag }}: this branch builds $pkg."
            echo "Re-run the tag-triggered build, or bump package.json to $want first."
            exit 1
          fi
          echo "package.json $pkg matches ${{ inputs.tag }}"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build desktop app
        working-directory: frontend
        run: ${{ matrix.build }}
        env:
          # NO GH_TOKEN here, deliberately. electron-builder's default publish
          # policy is onTagOrDraft: given a token + CI + a tag it would try to
          # upload to build.publish (the MIRROR) using this repo's GITHUB_TOKEN,
          # which cannot write to another repository — a 403 mid-build. Every
          # build script also passes --publish never. Publishing is the softprops
          # step below, with RELEASE_TOKEN, and only there.
          #
          # Optional — desktop already works without these (direct provider calls,
          # hardcoded Firebase fallback). Set as repo secrets for full parity.
          VITE_LLM_PROXY_BASE: ${{ secrets.VITE_LLM_PROXY_BASE }}
          VITE_AUTH_DOMAIN: ${{ secrets.VITE_AUTH_DOMAIN }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          # These builds are unsigned; skip signing/notarisation discovery rather
          # than failing the job on a missing certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: yogatik-${{ matrix.name }}
          retention-days: 1
          if-no-files-found: warn
          path: |
            frontend/release-electron/*.exe
            frontend/release-electron/*.dmg
            frontend/release-electron/*.zip
            frontend/release-electron/*.AppImage
            frontend/release-electron/*.deb
            frontend/release-electron/*.blockmap
            frontend/release-electron/latest*.yml

      # All three runners publish into the SAME release on the PUBLIC MIRROR
      # repo. The source repo is private, and GitHub release assets on a private
      # repo need an authenticated account — a public download link cannot work
      # against it. The mirror holds binaries only, so the source stays private
      # while downloads stay free and unmetered.
      #
      # Requires a secret RELEASE_TOKEN: a fine-grained PAT with Contents:
      # read-write on applicationmanifester/Yogatik-releases. The built-in
      # GITHUB_TOKEN cannot write to another repository.
      - name: Publish to public mirror Release
        if: env.RELEASE_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: applicationmanifester/Yogatik-releases
          token: ${{ secrets.RELEASE_TOKEN }}
          # A tag push uses its own tag. A MANUAL run has no tag context, so it
          # used to fall back to 'desktop-latest' — which creates a SECOND
          # release that takes over releases/latest and orphans the assets
          # already published under the real version. The optional `tag` input
          # lets a manual run publish into an existing release instead.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'desktop-latest' }}
          name: 'Yogatik Desktop ${{ github.ref_type == ''tag'' && github.ref_name || inputs.tag || ''(latest)'' }}'
          body: |
            Desktop builds for Windows, macOS and Linux — download under Assets.

            * **Windows** — `Yogatik-Setup.exe`
            * **macOS (Apple Silicon M1/M2/M3)** — `Yogatik-arm64.dmg` or `Yogatik-arm64.zip`
            * **macOS (Intel)** — `Yogatik-x64.dmg` or `Yogatik-x64.zip`
            * **Linux** — `Yogatik.AppImage` or `Yogatik.deb`

            These builds are unsigned. macOS will need right-click → Open the
            first time, and Windows SmartScreen may warn; that is expected until
            code-signing certificates are added.

            `latest*.yml` and `.blockmap` enable in-app auto-update.
          fail_on_unmatched_files: false
          files: |
            frontend/release-electron/*.exe
            frontend/release-electron/*.dmg
            frontend/release-electron/*.zip
            frontend/release-electron/*.AppImage
            frontend/release-electron/*.deb
            frontend/release-electron/*.blockmap
            frontend/release-electron/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Warn when the mirror token is missing
        if: env.RELEASE_TOKEN == ''
        run: |
          echo "::warning::RELEASE_TOKEN is not set, so nothing was published."
          echo "Binaries are still attached to this run as artefacts."
          echo "Add a fine-grained PAT with Contents: read-write on"
          echo "applicationmanifester/Yogatik-releases as the RELEASE_TOKEN secret."
