  <!--
    Content Security Policy.

    connect-src CANNOT be an allowlist here. The user configures their own
    provider, the tools call several dozen keyless APIs and public CORS relays,
    and the desktop build talks to localhost daemons — an enumerated list silently
    kills whichever host was forgotten. The previous list omitted, among others,
    integrate.api.nvidia.com (it named api.nvidia.com, which is not the host
    llm.js uses), the Cloudflare proxy worker, huggingface.co, and every open-data
    API, so tools failed with an opaque browser refusal rather than an error the
    app could report.

    script-src must include esm.run: WebLLM, Transformers.js, Kokoro, mermaid,
    qrcode and html2pdf are all loaded from it with dynamic import.

    This mirrors the policy served by firebase.json (Report-Only there, so
    violations can be observed before they break anything). Keep the two in sync.

    connect-src NAMES THE LOCAL DAEMON PORTS EXPLICITLY.
    Ollama (11434) and LM Studio (1234) serve plain HTTP on the loopback, and
    `https:` does not cover `http://127.0.0.1`. Without these entries the
    browser refuses the request before it leaves the machine — no CORS
    negotiation, no daemon involvement — and a CSP refusal cannot be caught or
    reported by the page, so it surfaced as a bare "Failed to fetch" that the
    app reported as "network or CORS proxy issue" on a machine where Ollama was
    running perfectly. The enableProviderCors shim in the main process could
    never have helped: a meta CSP blocks the fetch upstream of it.

    Both 127.0.0.1 and localhost are listed because the two are NOT
    interchangeable — on Windows 11 `localhost` resolves to ::1 first, and a
    user may also override the host with VITE_OLLAMA_HOST.

    Deliberately NOT blanket `http:`. That would let any plaintext origin
    through and drop the one protection this directive still provides on the
    web build, where nothing local is expected to be reachable anyway.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'wasm-unsafe-eval' https://esm.run https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.adtrafficquality.google https://*.google.com https://*.doubleclick.net https://ep2.adtrafficquality.google https://checkout.razorpay.com https://cdn.paddle.com;
    script-src-elem 'self' 'wasm-unsafe-eval' https://esm.run https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.adtrafficquality.google https://*.google.com https://*.doubleclick.net https://ep2.adtrafficquality.google https://checkout.razorpay.com https://cdn.paddle.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' data: https: ;
    img-src 'self' data: blob: https:;
    media-src 'self' blob: data: https:;
    connect-src 'self' https: wss: blob: data: http://127.0.0.1:11434 http://localhost:11434 http://127.0.0.1:1234 http://localhost:1234 ws://127.0.0.1:11434 ws://localhost:11434;
    worker-src 'self' blob:;
    frame-src 'self' https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://*.googlesyndication.com https://*.google.com https://*.doubleclick.net https://*.adtrafficquality.google https://ep1.adtrafficquality.google https://ep2.adtrafficquality.google https://api.razorpay.com https://checkout.razorpay.com https://*.razorpay.com https://*.paddle.com https://*.firebaseapp.com https://accounts.google.com https://www.youtube.com https://www.youtube-nocookie.com;
    object-src 'none';
    base-uri 'self';
    form-action 'self' https://accounts.google.com https://*.firebaseapp.com;

      <h1>Yogatik — private browser-native AI assistant</h1>
      <p>Yogatik is a private AI workspace running locally in your browser. Your conversations, documents, and settings stay in your device's local storage by default. Connect your chosen AI provider directly, route through our transparent developer proxy when provider CORS policies require it, or run offline with local models (Ollama or WebGPU). Optional encrypted cloud backup uses Firebase if you choose to sign in.</p>

      <h2>What it can do</h2>
      <ul>
        <li><strong>Live web research</strong> — searches several engines, reads the pages in parallel and cites its sources.</li>
        <li><strong>Document Q&amp;A</strong> — drop in a PDF and ask about it; text is extracted and indexed locally, never uploaded.</li>
        <li><strong>Real code execution</strong> — Python via WebAssembly, with a kernel that keeps its state between messages.</li>
        <li><strong>Images, charts, diagrams and narrated video</strong> — generated on your device or through free, keyless services.</li>
        <li><strong>Voice and vision</strong> — a face-to-face live mode with speech in and out, plus camera and screen sharing.</li>
        <li><strong>177 tools in total</strong>, all running in the browser.</li>
      </ul>
