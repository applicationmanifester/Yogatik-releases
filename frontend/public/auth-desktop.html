<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in to Yogatik Desktop</title>
  <link rel="icon" type="image/svg+xml" href="/icon-192.svg">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <style>
    :root {
      --bg: #0a0e14;
      --card-bg: #121820;
      --border: #1e2632;
      --accent: #ff6b35;
      --accent-gradient: linear-gradient(135deg, #ff6b35, #ff9f1c);
      --text: #f0f4f8;
      --muted: #8892b0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    .logo {
      width: 56px;
      height: 56px;
      margin-bottom: 16px;
      border-radius: 12px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: var(--muted);
      font-size: 13.5px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn-google {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      background: #ffffff;
      color: #1e293b;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-google:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(255,255,255,0.2);
    }
    .status-msg {
      margin-top: 18px;
      font-size: 13px;
      display: none;
    }
    .status-msg.error {
      color: #ef4444;
      display: block;
    }
    .status-msg.success {
      color: #10b981;
      display: block;
    }
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="auth-card">
    <img src="/icon-192.svg" alt="Yogatik" class="logo" />
    <h1>Sign in to Yogatik Desktop</h1>
    <p id="desc">Authenticate with Google to sync your settings, conversations, and custom Provider API Keys with the desktop app.</p>

    <button id="btn-login" class="btn-google" onclick="doLogin()">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/>
        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
        <path fill="#FBBC05" d="M5.6 14.8c-.3-.8-.4-1.8-.4-2.8s.1-2 .4-2.8L1.9 6.3C.7 8.7 0 10.3 0 12s.7 3.3 1.9 5.7l3.7-2.9z"/>
        <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/>
      </svg>
      <span id="btn-text">Sign in with Google</span>
    </button>

    <div id="status" class="status-msg"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCEaU6MKLAGNnWtexPj3GMcqRFKEeqI-D4",
      authDomain: "yogatik.firebaseapp.com",
      projectId: "yogatik",
      storageBucket: "yogatik.firebasestorage.app",
      messagingSenderId: "1024966461660",
      appId: "1:1024966461660:web:3d87c9ac725132418ccc19"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    const urlParams = new URLSearchParams(window.location.search);
    const callbackUrl = urlParams.get('callback');

    async function doLogin() {
      const btn = document.getElementById('btn-login');
      const btnText = document.getElementById('btn-text');
      const status = document.getElementById('status');
      const desc = document.getElementById('desc');

      status.className = 'status-msg';
      status.style.display = 'none';
      btn.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span> Connecting to Google…';

      try {
        const result = await auth.signInWithPopup(provider);
        const user = result.user;
        const idToken = await user.getIdToken();

        const payload = {
          uid: user.uid,
          displayName: user.displayName,
          email: user.email,
          photoURL: user.photoURL,
          idToken: idToken,
        };

        btnText.textContent = 'Transferring to Desktop…';
        status.className = 'status-msg success';
        status.textContent = '✨ Authentication successful! Sending credentials to Yogatik Desktop…';

        if (callbackUrl) {
          window.location.href = callbackUrl + (callbackUrl.includes('?') ? '&' : '?') + 'data=' + encodeURIComponent(JSON.stringify(payload));
        } else {
          desc.textContent = 'Signed in as ' + user.email;
          btnText.textContent = 'Signed in';
        }
      } catch (err) {
        console.error('Sign-in error:', err);
        btn.disabled = false;
        btnText.textContent = 'Sign in with Google';
        status.className = 'status-msg error';
        status.textContent = err.message || 'Authentication failed. Please try again.';
      }
    }

    // Automatically trigger on page load
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(doLogin, 300);
    });
  </script>
</body>
</html>
